services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: contexthub-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: contexthub-postgres
    environment:
      POSTGRES_USER: contexthub
      POSTGRES_PASSWORD: contexthub
      POSTGRES_DB: contexthub
    # Host 5433 → container 5432 (avoids conflict with a local PostgreSQL on 5432)
    ports:
      - "5433:5432"
    volumes:
      - contexthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthub -d contexthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contexthub_pgdata:
