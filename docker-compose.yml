services:
  opensearch:
    build:
      context: ./docker/opensearch
      dockerfile: Dockerfile
    image: contexthub-opensearch:2.17-nori
    container_name: contexthub-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      # OpenSearch 2.12+ demo security installer requires a value even when security is disabled for dev.
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=ContextHubAdmin123!"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Host 9201 avoids conflict with another process bound to 9200 (e.g. local Elasticsearch). Inside container: 9200.
      - "9201:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    container_name: contexthub-postgres
    environment:
      POSTGRES_USER: contexthub
      POSTGRES_PASSWORD: contexthub
      POSTGRES_DB: contexthub
    # Host 5433 → container 5432 (avoids conflict with a local PostgreSQL on 5432)
    ports:
      - "5433:5432"
    volumes:
      - contexthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contexthub -d contexthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contexthub_pgdata:
